plugins {
    id 'com.android.application'
}

// 版本号直接跟随桌面端 package.json, 两边不会再漂移
def desktopPkg = new groovy.json.JsonSlurper().parseText(file("$rootDir/../package.json").text)
def appVersionName = (project.findProperty('versionName') ?: desktopPkg.version).toString()
def versionParts = appVersionName.split('\\.')
def autoVersionCode = (versionParts[0] as int) * 10000 \
        + (versionParts.length > 1 ? (versionParts[1] as int) : 0) * 100 \
        + (versionParts.length > 2 ? (versionParts[2] as int) : 0)

android {
    namespace 'com.bilimusic.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bilimusic.app'
        minSdk 26
        targetSdk 34
        versionCode autoVersionCode
        versionName appVersionName
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false          // 保持简单, 避免反射调用被裁剪
            shrinkResources false
            signingConfig signingConfigs.debug   // 用 debug 签名, 方便直接侧载
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

/**
 * 界面源码只有一份: 构建时把桌面端的 src/renderer 与 src/qr.js 同步进 assets/www。
 * 这样安卓端与桌面端共用同一套 HTML/CSS/JS, 改一处两边都生效。
 */
def repoRoot = file("$rootDir/..")
tasks.register('syncWebAssets', Sync) {
    into "$projectDir/src/main/assets/www"
    from("$repoRoot/src/renderer") {
        include '**/*'
    }
    from("$repoRoot/src/qr.js")
}
tasks.named('preBuild').configure {
    dependsOn 'syncWebAssets'
}
