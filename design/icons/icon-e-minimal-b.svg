<svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0%" stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#161630"/>
    </linearGradient>
    <filter id="glowE">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bgE)"/>
  <rect x="3" y="3" width="250" height="250" rx="45" stroke="rgba(251,114,153,0.12)" stroke-width="3"/>
  <!-- Glowing B -->
  <text x="128" y="160" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="140" font-weight="800" text-anchor="middle" fill="#FB7299" filter="url(#glowE)">B</text>
</svg>
